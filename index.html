<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>First-Person 3D Surf Sim</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            touch-action: none;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        h1 { margin: 0 0 3px 0; font-size: 20px; color: #00ffff; }
        p { margin: 0; font-size: 12px; color: #ddd; }
        
        /* Mobile Overlay Controls */
        #left-controls {
            position: absolute;
            bottom: 30px;
            left: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }
        .control-btn {
            width: 75px;
            height: 75px;
            background: rgba(0, 255, 255, 0.25);
            border: 2px solid #00ffff;
            border-radius: 50%;
            color: white;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }
        .control-btn:active { background: rgba(0, 255, 255, 0.6); }

        #joystick-container {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            z-index: 10;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }
        #joystick-thumb {
            width: 50px;
            height: 50px;
            background: rgba(0, 255, 255, 0.6);
            border: 2px solid #fff;
            border-radius: 50%;
            position: absolute;
            pointer-events: none;
        }

        #combo-popup {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 28px;
            font-weight: bold;
            color: #ffff00;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.9);
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            pointer-events: none;
            text-align: center;
        }
        #gameover {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            display: none;
            background: rgba(0, 0, 0, 0.9);
            padding: 25px 40px;
            border: 2px solid #00ffff;
            border-radius: 12px;
            z-index: 20;
        }
        #gameover h2 { font-size: 30px; color: #ff3333; margin-top: 0; }
        .btn {
            background: #00ffff;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h1>FIRST-PERSON SURF</h1>
        <p>Score: <span id="score">0</span> pts | Speed: <span id="speed">0</span> kts</p>
    </div>

    <!-- Left Controls: Pump & Stall -->
    <div id="left-controls">
        <div class="control-btn" id="btn-pump">PUMP</div>
        <div class="control-btn" id="btn-stall" style="background: rgba(255, 100, 0, 0.25); border-color: #ff6600;">STALL</div>
    </div>

    <!-- Right Controls: Joystick -->
    <div id="joystick-container">
        <div id="joystick-thumb"></div>
    </div>

    <div id="combo-popup">BARREL LOCKED! +150</div>

    <div id="gameover">
        <h2>WIPED OUT!</h2>
        <p>Swallowed by the lip.</p>
        <p>Final Score: <span id="finalScore">0</span> pts</p>
        <button class="btn" onclick="restartGame()">Paddle Out</button>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let wave, boardModel;
        let clock = new THREE.Clock();

        let score = 0;
        let speed = 16;
        let riderPos = 0; // -3.3 to 3.2
        let isPlaying = true;
        let joystickX = 0;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x66b2ff);
            scene.fog = new THREE.FogExp2(0x80c2ff, 0.015);

            // First-person camera setup (FOV set wide for speed sensation)
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.05, 1000);
            camera.position.set(0, 0.5, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfffaed, 1.0);
            sunLight.position.set(20, 40, -20);
            scene.add(sunLight);

            createProceduralWave();
            createBodyboardFrontView();
            setupControls();

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function createProceduralWave() {
            // Large wave grid simulating an immersive barrel tube face
            const waveGeo = new THREE.PlaneGeometry(50, 400, 30, 140);
            const waveMat = new THREE.MeshStandardMaterial({
                color: 0x005588,
                roughness: 0.1,
                metalness: 0.4,
                side: THREE.DoubleSide,
                flatShading: true
            });

            wave = new THREE.Mesh(waveGeo, waveMat);
            wave.rotation.x = -Math.PI / 2;
            wave.position.set(0, -2, 200);
            scene.add(wave);

            // Ocean bottom plane
            const oceanGeo = new THREE.PlaneGeometry(600, 600);
            const oceanMat = new THREE.MeshBasicMaterial({ color: 0x002244 });
            const ocean = new THREE.Mesh(oceanGeo, oceanMat);
            ocean.rotation.x = -Math.PI / 2;
            ocean.position.set(0, -6, 0);
            scene.add(ocean);
        }

        function createBodyboardFirstPerson() {
            // Unused placeholder in pure FP, but we can keep camera clean or attach a board nose below
        }
        
        function createBodyboardFrontView() {
            // Build a small bodyboard nose visible at the bottom of the first-person screen
            const boardGeo = new THREE.BoxGeometry(0.6, 0.05, 0.8);
            const boardMat = new THREE.MeshStandardMaterial({ color: 0xff3300, roughness: 0.2 });
            boardModel = new THREE.Mesh(boardGeo, boardMat);
            boardModel.position.set(0, -0.4, -0.6);
            camera.add(boardModel);
            scene.add(camera); // Add camera to scene so child board model renders relative to view
        }

        function setupControls() {
            document.getElementById('btn-pump').addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (!isPlaying) return;
                speed += 3;
                triggerPopup("PUMP SPEED! +50");
            });
            document.getElementById('btn-stall').addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (!isPlaying) return;
                speed -= 4;
                triggerPopup("DEEP BARREL STALL! +100");
            });

            const container = document.getElementById('joystick-container');
            const thumb = document.getElementById('joystick-thumb');
            const maxDist = 35;

            function updateJoystick(clientX, clientY) {
                const rect = container.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                
                let dx = clientX - centerX;
                let dy = clientY - centerY;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist > maxDist) {
                    dx = (dx / dist) * maxDist;
                    dy = (dy / dist) * maxDist;
                }

                thumb.style.transform = `translate(${dx}px, ${dy}px)`;
                joystickX = dx / maxDist;
            }

            container.addEventListener('touchmove', (e) => {
                e.preventDefault();
                updateJoystick(e.targetTouches[0].clientX, e.targetTouches[0].clientY);
            }, { passive: false });

            container.addEventListener('touchend', (e) => {
                e.preventDefault();
                thumb.style.transform = `translate(0px, 0px)`;
                joystickX = 0;
            });

            let mouseDragging = false;
            container.addEventListener('mousedown', () => { mouseDragging = true; });
            window.addEventListener('mousemove', (e) => {
                if (!mouseDragging) return;
                updateJoystick(e.clientX, e.clientY);
            });
            window.addEventListener('mouseup', () => {
                if (!mouseDragging) return;
                mouseDragging = false;
                thumb.style.transform = `translate(0px, 0px)`;
                joystickX = 0;
            });
        }

        function triggerPopup(text) {
            const popup = document.getElementById('combo-popup');
            popup.innerText = text;
            popup.style.opacity = '1';
            score += parseInt(text.match(/\+(\d+)/)[1]);
            setTimeout(() => { popup.style.opacity = '0'; }, 800);
        }

        function animate() {
            if (!isPlaying) return;

            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            score += speed * delta * 1.5;
            document.getElementById('score').innerText = Math.floor(score);
            document.getElementById('speed').innerText = Math.round(speed);

            speed -= delta * 0.8;
            if (speed < 5) speed = 5;
            if (speed > 42) speed = 42;

            // Update lateral position across wave face
            riderPos += joystickX * 5.0 * delta;

            // Wipeout boundaries
            if (riderPos < -3.3 || riderPos > 3.2) {
                gameOver();
                return;
            }

            // Position first-person camera right on the wave face
            camera.position.x = riderPos;
            camera.position.y = 0.4 + Math.sin(clock.getElapsedTime() * 8) * 0.05; // Bobbing water feel

            // First-person banking tilt rotation based on turns
            camera.rotation.z = -joystickX * 0.35;
            camera.rotation.y = joystickX * 0.2;

            // Dynamic rolling barrel wave animation
            const time = clock.getElapsedTime();
            const posAttr = wave.geometry.attributes.position;
            for (let i = 0; i < posAttr.count; i++) {
                let vx = posAttr.getX(i);
                let vy = posAttr.getY(i);
                let curl = Math.sin(vy * 0.04 - time * 6) * Math.cos(vx * 0.08) * 1.8;
                if (vx > 1) curl += Math.pow(vx, 1.3) * 0.25;
            }

            renderer.render(scene, camera);
        }

        function gameOver() {
            isPlaying = false;
            document.getElementById('finalScore').innerText = Math.floor(score);
            document.getElementById('gameover').style.display = 'block';
        }

        function restartGame() {
            score = 0;
            speed = 16;
            riderPos = 0;
            joystickX = 0;
            isPlaying = true;
            document.getElementById('gameover').style.display = 'none';
            clock.start();
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
