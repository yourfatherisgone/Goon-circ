<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SumbaSurf Portal</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        header {
            height: 40px;
            background: #222;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }
        #game-container {
            width: 100%;
            height: calc(100% - 40px);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <span>SumbaSurf Web Arcade</span>
        <button onclick="toggleFullscreen()" style="background: #444; color: #fff; border: none; padding: 5px 10px; cursor: pointer;">Fullscreen</button>
    </header>

    <div id="game-container">
        <!-- Loads SumbaSurf directly inside your wrapper iframe -->
        <iframe id="gameFrame" src="https://wavedash.com/games/sumbasurf" allow="fullscreen; gamepad; accelerometer; gyroscope" allowfullscreen></iframe>
    </div>

    <script>
        function toggleFullscreen() {
            var iframe = document.getElementById('gameFrame');
            if (iframe.requestFullscreen) {
                iframe.requestFullscreen();
            } else if (iframe.mozRequestFullScreen) {
                iframe.mozRequestFullScreen();
            } else if (iframe.webkitRequestFullscreen) {
                iframe.webkitRequestFullscreen();
            }
        }
    </script>

</body>
</html>
