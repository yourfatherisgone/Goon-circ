<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Hub</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --border-color: #334155;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body, html {
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Top Navigation / Address Bar */
        header {
            height: 60px;
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 1rem;
            gap: 1rem;
            flex-shrink: 0;
        }

        .brand {
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: -0.5px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.5px;
        }

        .brand span {
            color: var(--accent-color);
        }

        .url-form {
            flex: 1;
            display: flex;
            gap: 0.5rem;
            max-width: 800px;
        }

        .url-input {
            flex: 1;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.5rem 1rem;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .url-input:focus {
            border-color: var(--accent-color);
        }

        .go-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 0 1.25rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .go-btn:hover {
            background-color: var(--accent-hover);
        }

        /* Main Workspace layout */
        .workspace {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        /* Quick Launch Sidebar */
        sidebar {
            width: 260px;
            background-color: var(--surface-color);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 1rem;
            gap: 0.75rem;
            flex-shrink: 0;
        }

        .sidebar-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 0.25rem;
        }

        .shortcut-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.65rem 1rem;
            text-align: left;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .shortcut-btn:hover {
            background-color: var(--border-color);
            border-color: var(--text-muted);
        }

        /* Content Area / Iframe Container */
        .viewport-container {
            flex: 1;
            background-color: #000;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Responsive adjustments for mobile/smaller screens */
        @media (max-width: 768px) {
            sidebar {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- Top Navigation Bar with Custom URL loader -->
    <header>
        <div class="brand">Hub<span>OS</span></div>
        <form class="url-form" id="urlForm" onsubmit="loadSite(event)">
            <input type="text" id="urlInput" class="url-input" placeholder="Enter target URL (e.g., https://example.com)" autocomplete="off">
            <button type="submit" class="go-btn">Load</button>
        </form>
    </header>

    <!-- Main Content Grid -->
    <div class="workspace">
        <!-- Quick App/Site Launcher Sidebar -->
        <sidebar>
            <div class="sidebar-title">Quick Shortcuts</div>
            <!-- Change these data-url parameters to any sites you want quick access to -->
            <button class="shortcut-btn" onclick="setAndLoad('https://example.com')">Example Site <span>↗</span></button>
            <button class="shortcut-btn" onclick="setAndLoad('https://wikipedia.org')">Wikipedia <span>↗</span></button>
            <button class="shortcut-btn" onclick="setAndLoad('https://retrobowl.me')">Retro Bowl Hub <span>↗</span></button>
        </sidebar>

        <!-- Display Screen -->
        <div class="viewport-container">
            <iframe id="webFrame" src="https://example.com" title="Viewer Viewport"></iframe>
        </div>
    </div>

    <script>
        function loadSite(event) {
            event.preventDefault();
            let url = document.getElementById('urlInput').value.trim();
            if(!url) return;
            
            // Auto-prepend https:// if missing
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }
            
            document.getElementById('webFrame').src = url;
        }

        function setAndLoad(url) {
            document.getElementById('urlInput').value = url;
            document.getElementById('webFrame').src = url;
        }
    </script>
</body>
</html>
