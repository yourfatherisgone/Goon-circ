<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bypass Viewer</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --border-color: #334155;
            --accent-color: #3b82f6;
            --text-main: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body, html {
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            height: 60px;
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 1rem;
            gap: 1rem;
        }

        .url-form {
            flex: 1;
            display: flex;
            gap: 0.5rem;
            max-width: 800px;
        }

        .url-input {
            flex: 1;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.5rem 1rem;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
        }

        .go-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 0 1.25rem;
            font-weight: 600;
            cursor: pointer;
        }

        #content-container {
            flex: 1;
            width: 100%;
            height: calc(100vh - 60px);
            background: #ffffff;
            border: none;
        }
        
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: #64748b;
            font-size: 1.1rem;
            background: var(--bg-color);
        }
    </style>
</head>
<body>

    <header>
        <form class="url-form" id="urlForm" onsubmit="fetchSite(event)">
            <input type="text" id="urlInput" class="url-input" placeholder="Enter target URL (e.g., https://example.com)" autocomplete="off">
            <button type="submit" class="go-btn">Load</button>
        </form>
    </header>

    <div id="content-container">
        <div class="loading">Enter a URL above and click Load.</div>
    </div>

    <script>
        async function fetchSite(event) {
            event.preventDefault();
            let url = document.getElementById('urlInput').value.trim();
            if (!url) return;

            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            const container = document.getElementById('content-container');
            container.innerHTML = '<div class="loading">Fetching and bypassing restrictions...</div>';

            try {
                // Using an open CORS-anywhere style proxy or allorigins endpoint to fetch raw content
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
                const response = await fetch(proxyUrl);
                const data = await response.json();

                if (data.contents) {
                    // Inject the fetched HTML into an sandboxed object/iframe container or document replacement
                    container.innerHTML = `<iframe id="renderedFrame" style="width:100%; height:100%; border:none;"></iframe>`;
                    const iframeDoc = document.getElementById('renderedFrame').contentWindow.document;
                    iframeDoc.open();
                    iframeDoc.write(data.contents);
                    iframeDoc.close();
                } else {
                    container.innerHTML = `<div class="loading" style="color: #ef4444;">Failed to load content from the target URL.</div>`;
                }
            } catch (err) {
                container.innerHTML = `<div class="loading" style="color: #ef4444;">Error fetching site: ${err.message}</div>`;
            }
        }
    </script>
</body>
</html>
